# Run the test suite on every push and pull request.
#
# The suite is fast (a few seconds) and needs no services: the tests build their
# own SQLite fixture, so there is nothing to configure here. Its job is to catch
# the mistakes that reorganisation causes -- a moved template, a renamed query
# function, a script tag pointing at a filename that no longer exists -- before
# they reach the site rather than after.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The web app and the standalone programs share the `common` package, so
      # it is installed in editable mode exactly as a developer installs it.
      - name: Install
        run: pip install -e ".[web,dev]"

      - name: Run tests
        run: python -m pytest tests/ -q
